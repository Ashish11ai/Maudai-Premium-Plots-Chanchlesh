[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm run build"

# Redirect /admin to /admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Route all /api calls to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single Page Application fallback for index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
